name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── TypeScript ───────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Setup npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  # ─── Oxlint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Setup npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ─── Tests ────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Setup npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Setup npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:production

  # ─── Security audit ───────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Setup npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Audit (high & critical only)
        run: npm audit --audit-level=high --omit=dev
