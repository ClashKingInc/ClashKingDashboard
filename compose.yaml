services:
  clashking-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CLASHKING_API_ORIGIN: ${CLASHKING_API_ORIGIN:-https://api.clashk.ing}
        VITE_CLASHKING_AI_ORIGIN: ${CLASHKING_AI_ORIGIN:-https://ai.clashk.ing}
        VITE_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-824653933347209227}
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
